# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Pharmacy MCP Gateway
site_description: MCP + agent harness for traceable, multi-source pharmaceutical knowledge
site_url: https://u9401066.github.io/pharmacy-mcp/
repo_url: https://github.com/u9401066/pharmacy-mcp
repo_name: u9401066/pharmacy-mcp
edit_uri: edit/main/docs/
copyright: Apache-2.0 · Reference data only; not medical advice

theme:
  name: material
  language: zh-TW
  icon:
    logo: material/pill
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切換至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切換至淺色模式

nav:
  - 首頁: index.md
  - Agent 單一入口:
      - Harness 與輸出約束: agent-harness.md
      - Assistant harness assets: harness-assets.md
      - QueryResponse 契約: architecture/response-contract.md
  - 資料整合:
      - 資料來源總覽: data-sources.md
      - 公共藥品 API: public-apis.md
      - 台灣健保複合查詢: taiwan-nhi.md
      - FHIR 與院內庫存: fhir.md
      - 院內資料連接器: connectors.md
  - 可信任 PK/DDI 模擬: simulation.md
  - 維運與來源健康: operations.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css
