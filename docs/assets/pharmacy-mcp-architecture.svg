<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1400 820">
  <title id="title">Pharmacy MCP architecture</title>
  <desc id="desc">Clients enter through FastMCP, a bounded unified query service fans out to public, Taiwan, hospital, and organization providers, and every result returns through a traceable QueryResponse envelope.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b27"/>
      <stop offset="1" stop-color="#0b2831"/>
    </linearGradient>
    <linearGradient id="gateway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f665d"/>
      <stop offset="1" stop-color="#154a68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001018" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#79dbc5"/>
    </marker>
  </defs>

  <rect width="1400" height="820" rx="28" fill="url(#canvas)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="58" y="66" fill="#ffffff" font-size="30" font-weight="760">Traceable pharmaceutical knowledge plane</text>
    <text x="58" y="98" fill="#a9d9d2" font-size="17">One schema-bound edge, independently failing providers, operator-owned boundaries.</text>

    <text x="60" y="153" fill="#75dcc5" font-size="14" font-weight="760" letter-spacing="2">CLIENTS</text>
    <text x="425" y="153" fill="#75dcc5" font-size="14" font-weight="760" letter-spacing="2">GATEWAY</text>
    <text x="930" y="153" fill="#75dcc5" font-size="14" font-weight="760" letter-spacing="2">KNOWLEDGE PROVIDERS</text>

    <g filter="url(#shadow)">
      <rect x="58" y="178" width="260" height="78" rx="17" fill="#102f3c" stroke="#5aafc1"/>
      <text x="88" y="209" fill="#90d8e7" font-size="13" font-weight="700">MODEL CONTEXT PROTOCOL</text>
      <text x="88" y="235" fill="#ffffff" font-size="19" font-weight="700">Claude / Codex / Agents</text>

      <rect x="58" y="274" width="260" height="78" rx="17" fill="#102f3c" stroke="#5aafc1"/>
      <text x="88" y="305" fill="#90d8e7" font-size="13" font-weight="700">DEPLOYMENT</text>
      <text x="88" y="331" fill="#ffffff" font-size="18" font-weight="700">stdio / HTTP / ASGI</text>

      <rect x="58" y="370" width="260" height="78" rx="17" fill="#102f3c" stroke="#5aafc1"/>
      <text x="88" y="401" fill="#90d8e7" font-size="13" font-weight="700">PROGRAMMATIC</text>
      <text x="88" y="427" fill="#ffffff" font-size="18" font-weight="700">Python harness / CLI</text>
    </g>

    <path d="M 318 217 H 389" stroke="#79dbc5" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 318 313 H 389" stroke="#79dbc5" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 318 409 H 389" stroke="#79dbc5" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="410" y="178" width="430" height="270" rx="23" fill="url(#gateway)" stroke="#8eead2" stroke-opacity="0.7"/>
      <text x="445" y="215" fill="#b8f6e8" font-size="13" font-weight="760" letter-spacing="1.5">PRESENTATION BOUNDARY</text>
      <text x="445" y="244" fill="#ffffff" font-size="22" font-weight="760">PharmacyFastMCP · 35 tools</text>
      <rect x="445" y="267" width="360" height="64" rx="14" fill="#071f2a" fill-opacity="0.7" stroke="#9aead7" stroke-opacity="0.42"/>
      <text x="468" y="293" fill="#8eead2" font-size="13" font-weight="700">APPLICATION ORCHESTRATION</text>
      <text x="468" y="316" fill="#ffffff" font-size="15" font-weight="700">UnifiedQueryService + provider registry</text>
      <rect x="445" y="347" width="171" height="70" rx="14" fill="#071f2a" fill-opacity="0.7"/>
      <text x="530.5" y="375" text-anchor="middle" fill="#a4ecdc" font-size="13" font-weight="700">SERVER POLICY</text>
      <text x="530.5" y="397" text-anchor="middle" fill="#ffffff" font-size="14">fan-out · slots · timeout</text>
      <rect x="634" y="347" width="171" height="70" rx="14" fill="#071f2a" fill-opacity="0.7"/>
      <text x="719.5" y="375" text-anchor="middle" fill="#a4ecdc" font-size="13" font-weight="700">FAILURE MODEL</text>
      <text x="719.5" y="397" text-anchor="middle" fill="#ffffff" font-size="14">partial · isolated · typed</text>
    </g>

    <path d="M 840 234 H 893" stroke="#79dbc5" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 840 312 H 893" stroke="#79dbc5" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 840 390 H 893" stroke="#79dbc5" stroke-width="3" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="915" y="178" width="427" height="78" rx="17" fill="#123d3c" stroke="#63d4b6"/>
      <text x="945" y="209" fill="#8fe7ce" font-size="13" font-weight="700">PUBLIC + NATIONAL</text>
      <text x="945" y="235" fill="#ffffff" font-size="14" font-weight="700">RxNorm · openFDA · NLM · TFDA/NHI · research</text>

      <rect x="915" y="274" width="427" height="78" rx="17" fill="#17394c" stroke="#78bce9"/>
      <text x="945" y="305" fill="#9ed5f6" font-size="13" font-weight="700">HOSPITAL INTEROPERABILITY</text>
      <text x="945" y="331" fill="#ffffff" font-size="14" font-weight="700">FHIR R4/R5 · inventory · configured SOAP/WCF</text>

      <rect x="915" y="370" width="427" height="78" rx="17" fill="#28364f" stroke="#8aabdf"/>
      <text x="945" y="401" fill="#b7cdf4" font-size="13" font-weight="700">ORGANIZATION KNOWLEDGE</text>
      <text x="945" y="427" fill="#ffffff" font-size="17" font-weight="700">Files · read-only SQL · vector · fixed web</text>
    </g>

    <path d="M 625 448 V 506" stroke="#79dbc5" stroke-width="3" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
      <rect x="302" y="524" width="798" height="104" rx="22" fill="#0d3440" stroke="#82dfca"/>
      <text x="701" y="558" text-anchor="middle" fill="#91e9d5" font-size="13" font-weight="760" letter-spacing="1.5">QUERYRESPONSE V1.0</text>
      <text x="701" y="592" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="720">schema_version · status · data · sources · warnings · errors · meta</text>
      <text x="701" y="615" text-anchor="middle" fill="#bbddd8" font-size="14">structuredContent is authoritative; renderers are deterministic views.</text>
    </g>

    <rect x="58" y="676" width="1284" height="86" rx="20" fill="#061820" stroke="#356e72"/>
    <text x="88" y="708" fill="#75dcc5" font-size="13" font-weight="760" letter-spacing="1.4">OPERATOR-OWNED TRUST BOUNDARY</text>
    <text x="88" y="740" fill="#d7eeea" font-size="16">SecretStr credentials  ·  allowlisted roots/tables/fields/resources  ·  TLS verification  ·  bounded payloads  ·  source provenance</text>
  </g>
</svg>
