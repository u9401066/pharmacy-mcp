name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Check formatting
        run: uv run ruff format --check src tests examples scripts
      - name: Lint
        run: uv run ruff check src tests examples scripts
      - name: Type check
        run: uv run mypy src
      - name: Security scan
        run: uv run bandit -r src -c pyproject.toml -q

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run test suite
        run: uv run pytest --cov=pharmacy_mcp --cov-report=term
      - name: Build distribution
        run: uv build
      - name: Audit release artifacts
        run: uv run python scripts/audit_release_artifacts.py dist
      - name: Smoke-test installed wheel
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          python -m venv /tmp/pharmacy-mcp-wheel-smoke
          /tmp/pharmacy-mcp-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/pharmacy-mcp-wheel-smoke/bin/python - <<'PY'
          import asyncio

          from pharmacy_mcp.infrastructure.knowledge.formula_catalog import FormulaCatalog
          from pharmacy_mcp.presentation.server import create_server

          async def check() -> None:
              assert FormulaCatalog().count >= 6
              server = create_server()
              tools = await server.list_tools()
              assert len(tools) == 35
              assert all(tool.outputSchema is not None for tool in tools)

          asyncio.run(check())
          PY

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Build documentation
        run: uv run mkdocs build --strict
