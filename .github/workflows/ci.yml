name: CI

on:
  push:
    branches: ["main", "release/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Type check
        run: uv run mypy src

      - name: Security scan
        run: uv run bandit -q -r src

      - name: Test with coverage
        run: uv run pytest --cov=src --cov-report=term-missing

      - name: Build package
        run: rm -rf dist && uv build

      - name: Audit release artifacts
        run: uv run python scripts/audit_release_artifacts.py dist

      - name: Wheel install smoke test
        shell: bash
        run: |
          python -m venv /tmp/pharmacy-mcp-wheel-smoke
          /tmp/pharmacy-mcp-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/pharmacy-mcp-wheel-smoke/bin/python - <<'PY'
          from pharmacy_mcp.infrastructure.knowledge.formula_catalog import FormulaCatalog
          from pharmacy_mcp.presentation.server import create_server

          assert FormulaCatalog().count >= 6
          server = create_server()
          assert server.name == "pharmacy-mcp"
          PY
