[project]
name = "pharmacy-mcp"
version = "1.0.0a1"
description = "Unified pharmacy knowledge MCP gateway and agent harness with Taiwan NHI, FHIR, local data, and trusted PK/DDI simulation."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Pharmacy MCP Team", email = "u9401066@gap.kmu.edu.tw" }
]
keywords = [
    "mcp",
    "pharmacy",
    "drug",
    "medication",
    "interaction",
    "dosage",
    "fhir",
    "fda",
    "rxnorm",
    "taiwan",
    "nhi",
    "tfda",
    "simulation",
    "pk",
    "ddi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "mcp>=1.27.0,<2",
    "httpx>=0.27.0,<1",
    "pydantic>=2.5.0,<3",
    "pydantic-settings>=2.1.0,<3",
    "aiosqlite>=0.19.0,<1",
    "diskcache>=5.6.0,<6",
    "pypdf>=5.0.0,<7",
    "python-docx>=1.1.0,<2",
    "openpyxl>=3.1.0,<4",
    "xlrd>=2.0.1,<3",
    "uvicorn>=0.30.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "respx>=0.20.0",
    "mypy>=1.8.0",
    "ruff>=0.1.9",
    "bandit[toml]>=1.7.6",
    "types-openpyxl",
    "types-requests",
    "types-xlrd",
]
docs = [
    "mkdocs-material>=9.7.0",
]

[project.scripts]
pharmacy-mcp = "pharmacy_mcp.presentation.server:main"
pharmacy-query = "pharmacy_mcp.presentation.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmacy_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.asset-aware-mcp",
    "/.cache",
    "/.coverage",
    "/.claude",
    "/.cline",
    "/.clinerules",
    "/.codex",
    "/.github",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/build",
    "/data/.uv-cache",
    "/data/exports",
    "/data/jobs",
    "/data/tables",
    "/dist",
    "/docs/superpowers",
    "/htmlcov",
    "/scripts",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pharmacy_mcp"]

[tool.ruff.lint.per-file-ignores]
"examples/langgraph_prescription/demo.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["diskcache", "diskcache.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = ["-v", "--strict-markers", "--tb=short", "-ra"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (may require network)",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 70
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
